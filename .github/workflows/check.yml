name: Beta checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: python3 scripts/prepare-geoip.py
      - run: mvn -B -f backend/pom.xml verify
      - run: ./scripts/init-env.sh
      - run: docker compose build
      - run: docker compose --env-file .env.example config --quiet
        env:
          POSTGRES_PASSWORD: ci-config-validation-only
          APP_MASTER_KEY: ci-config-validation-only
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Start app for browser regression checks
        run: |
          docker compose up -d --no-build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8088/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8088/api/health
      - name: Chromium native download and metadata recovery
        run: |
          python frontend/e2e/smoke.py
          python frontend/e2e/languages.py
          python frontend/e2e/resume.py
        env:
          BASE_URL: http://127.0.0.1:8088
          BROWSER: chromium
          RESUME_RESTART_PROJECT: pollydrop-beta
      - name: WebKit with iPhone emulation
        run: |
          python frontend/e2e/smoke.py
          python frontend/e2e/languages.py
          python frontend/e2e/resume.py
        env:
          BASE_URL: http://127.0.0.1:8088
          BROWSER: webkit
      - if: always()
        run: docker compose down
