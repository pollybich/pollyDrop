# Conservative server-wide limits for the small public beta.
limit_req_zone $server_name zone=pollydrop_create:1m rate=12r/m;
limit_conn_zone $server_name zone=pollydrop_inflight:1m;
map $request_method $pollydrop_upload_creation {
    default "";
    PUT $server_name;
}
limit_req_zone $pollydrop_upload_creation zone=pollydrop_upload_create:1m rate=12r/m;
server {
    listen 80;
    server_name _;
    # Public requests arrive through Caddy, which replaces untrusted forwarding headers.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Transfer and management tokens are secrets: never log request paths.
    access_log off;
    error_log /dev/null crit;
    root /usr/share/nginx/html;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 26m;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/transfers {
        limit_req zone=pollydrop_create burst=3 nodelay;
        limit_req_status 429;
        limit_conn pollydrop_inflight 2;
        limit_conn_status 429;
        error_page 429 = @busy;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ~ "^/api/(transfers/[A-Za-z0-9_-]{43}/download(-ticket)?|downloads/[A-Za-z0-9_-]{43})$" {
        limit_conn pollydrop_inflight 2;
        limit_conn_status 429;
        error_page 429 = @busy;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location @busy {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":"SERVER_BUSY","message":"Сервис занят. Попробуйте через минуту."}';
    }
    location ~ "^/api/uploads/[A-Za-z0-9_-]{43}(/complete)?$" {
        client_max_body_size 1m;
        limit_req zone=pollydrop_upload_create burst=3 nodelay;
        limit_req_status 429;
        limit_conn pollydrop_inflight 2;
        limit_conn_status 429;
        error_page 429 = @busy;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Preserve the direct client identity; never trust an arbitrary incoming forwarding header.
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { try_files $uri $uri/ /index.html; }
}
